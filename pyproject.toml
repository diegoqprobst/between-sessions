[project]
name = "between-sessions"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "openai-agents",
  "openai",
  "twilio",
  "httpx",
  "python-dotenv",
  "pydantic",
  "any-llm-sdk[ollama]",
  "slack-bolt>=1.30.0",
]
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-asyncio",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv]
package = false
